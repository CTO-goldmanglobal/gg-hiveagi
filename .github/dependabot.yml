# Dependabot — keeps Python dependencies up to date + security alerts
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # P1 — LLM Wiki Engine
  - package-ecosystem: "pip"
    directory: "/llm_wiki_engine"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "p1-llm-engine"
    commit-message:
      prefix: "deps(p1)"

  # P0 — Seed Generator
  - package-ecosystem: "pip"
    directory: "/tools/seed_generator"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "p0-seed-gen"
    commit-message:
      prefix: "deps(p0)"

  # PII Anonymizer (auto-vision path) — pinned because the safety gate
  # test depends on a stable synthetic-face detection score. Bumps arrive
  # as PRs that must re-run test_safety_gate.py before merge.
  - package-ecosystem: "pip"
    directory: "/tools/pii_anonymizer"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "pii-safety"
    commit-message:
      prefix: "deps(pii)"

  # P2 — P2P Exchange (currently stdlib-only; entry kept for future deps)
  - package-ecosystem: "pip"
    directory: "/p2p_exchange"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "p2-p2p"
    commit-message:
      prefix: "deps(p2)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(ci)"
