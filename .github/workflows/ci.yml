name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: P0 + P1 Mock Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/seed_generator/requirements.txt
          pip install -r llm_wiki_engine/requirements.txt
          # PII anonymizer deps — needed for the safety gate test below.
          # Heavy native deps (opencv-python, mediapipe), but the safety gate
          # is the one thing CONTRIBUTING.md promises hardest, so it must have CI coverage.
          # mediapipe needs OpenGL ES libs on Linux (headless CI has no GL by default).
          if [ "$(uname)" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq libgles2 libegl1
          fi
          pip install -r tools/pii_anonymizer/requirements.txt

      - name: P0 — Seed Generator
        run: python tools/seed_generator/generate_seed.py

      - name: P0 — Seed Validator
        run: |
          python tools/seed_generator/validate_seed.py \
            --path seed_output/seed_goldman_20260725/

      - name: P1 — LLM Wiki Engine (mock, all 3 audit branches)
        env:
          # Explicitly empty — mock mode needs no keys
          MINIMAX_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: |
          set -e
          # pass branch
          python -m llm_wiki_engine process \
            --inbox llm_wiki_engine/test_samples \
            --entries /tmp/ci_pass \
            --mock --audit-fail-mode pass

          # corrected branch
          python -m llm_wiki_engine process \
            --inbox llm_wiki_engine/test_samples \
            --entries /tmp/ci_corr \
            --mock --audit-fail-mode corrected

          # quarantine branch (exits 0 even when all quarantine)
          python -m llm_wiki_engine process \
            --inbox llm_wiki_engine/test_samples \
            --entries /tmp/ci_quar \
            --quarantine /tmp/ci_q \
            --mock --audit-fail-mode quarantine

      - name: Cross-compat — P0 validator on P1 output (pass branch)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/seed_generator")
          from validate_seed import validate_entry

          failures = 0
          for md in sorted(Path("/tmp/ci_pass").glob("*.md")):
              ok, errs = validate_entry(md)
              if not ok:
                  failures += 1
                  print(f"FAIL {md.name}: {errs}")
          if failures:
              sys.exit(f"{failures} entries failed P0 validation")
          print("All P1 entries passed P0 validation")
          PY

      - name: Cross-compat — P0 validator on P1 output (corrected branch)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/seed_generator")
          from validate_seed import validate_entry

          failures = 0
          for md in sorted(Path("/tmp/ci_corr").glob("*.md")):
              ok, errs = validate_entry(md)
              if not ok:
                  failures += 1
                  print(f"FAIL {md.name}: {errs}")
          if failures:
              sys.exit(f"{failures} entries failed P0 validation")
          print("All corrected P1 entries passed P0 validation")
          PY

      - name: P2 — P2P Exchange (mock publish/verify/tamper/resolve)
        env:
          MINIMAX_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: |
          set -e
          # publish -> capture CID
          CID=$(python -m p2p_exchange publish \
            --package seed_output/seed_goldman_20260725 \
            --mock | awk '/^   CID:/ {print $2}')
          test -n "$CID"

          # verify intact -> must pass
          python -m p2p_exchange verify \
            --package seed_output/seed_goldman_20260725 \
            --cid "$CID" --mock

          # tamper -> verify must FAIL (exit 1)
          cp -r seed_output/seed_goldman_20260725 /tmp/ci_tampered
          echo "TAMPER" >> /tmp/ci_tampered/entries/entry_001.md
          set +e
          python -m p2p_exchange verify \
            --package /tmp/ci_tampered --cid "$CID" --mock
          verify_exit=$?
          set -e
          if [ "$verify_exit" -ne 1 ]; then
            echo "tamper NOT detected (exit=$verify_exit, expected 1)"
            exit 1
          fi
          echo "tamper correctly detected"

          # resolve -> reconstruct
          python -m p2p_exchange resolve \
            --cid "$CID" --out /tmp/ci_resolved --mock

          # determinism: re-publish -> same CID
          CID2=$(python -m p2p_exchange publish \
            --package seed_output/seed_goldman_20260725 \
            --mock | awk '/^   CID:/ {print $2}')
          test "$CID" = "$CID2"

      - name: Cross-compat — P0 validator on P2-resolved package
        run: |
          python tools/seed_generator/validate_seed.py --path /tmp/ci_resolved

      - name: PII safety gate (face detection + blur + dep-absence refusal)
        run: |
          # The safety gate is the one thing CONTRIBUTING.md promises hardest
          # ("code-enforced, no bypass"). This test feeds a synthetic face
          # through anonymize_image() and asserts it's detected + blurred,
          # then asserts SafetyError raises when mediapipe is hidden.
          # A refactor that silently breaks blurring must fail CI here.
          python tools/pii_anonymizer/test_safety_gate.py
